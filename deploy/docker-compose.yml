# Bartie's stack. Two ways to run it:
#
#   Local development (the scripts/ demos): only the three data services run in
#   Docker and the Go binaries run on the host, talking to the published ports.
#
#     docker compose up -d
#
#   Live deployment (deploy/vm): everything runs in Docker, including the
#   pipeline binaries, the control api, and Caddy for TLS.
#
#     docker compose --profile live up -d --build
#
# Run ./fetch-terra.sh once first: it clones artie-labs/terra, whose init SQL
# (schema + seed + publication) is mounted into the source container.
services:
  source:
    image: postgres:16
    container_name: bartie-source
    environment:
      POSTGRES_PASSWORD: bartie
      POSTGRES_DB: terra
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5410:5432"
    volumes:
      - ./terra/pg/init:/docker-entrypoint-initdb.d:ro
      - source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terra && psql -U postgres -d terra -tAc 'SELECT 1 FROM pg_publication LIMIT 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: bartie-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  dest:
    # pgvector's image is postgres:16 plus the vector extension, so the plain
    # replica tables are unaffected and the vector destination needs no
    # separate database.
    image: pgvector/pgvector:pg16
    container_name: bartie-dest
    environment:
      POSTGRES_PASSWORD: bartie
      POSTGRES_DB: warehouse
    ports:
      - "5411:5432"
    volumes:
      - dest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- live profile: the pipeline itself, in containers -------------------

  reader:
    profiles: ["live"]
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: bartie:local
    container_name: bartie-reader
    command: ["reader"]
    environment: &pipeline_env
      MINICDC_SOURCE_DSN: postgres://postgres:bartie@source:5432/terra
      MINICDC_DEST_DSN: postgres://postgres:bartie@dest:5432/warehouse
      MINICDC_KAFKA_BROKER: redpanda:9092
      MINICDC_READER_METRICS_ADDR: 0.0.0.0:9102
      MINICDC_WRITER_METRICS_ADDR: 0.0.0.0:9101
      MINICDC_VEC_METRICS_ADDR: 0.0.0.0:9103
      MINICDC_READER_METRICS_URL: http://reader:9102
      MINICDC_WRITER_METRICS_URL: http://writer:9101
      MINICDC_VEC_METRICS_URL: http://vecwriter:9103
      MINICDC_ERROR_LOG: /var/lib/bartie/errors.jsonl
      MINICDC_EMBED_PROVIDER: ${MINICDC_EMBED_PROVIDER:-hash}
      MINICDC_EMBED_MODEL: ${MINICDC_EMBED_MODEL:-text-embedding-3-small}
      MINICDC_EMBED_DIM: ${MINICDC_EMBED_DIM:-1536}
      MINICDC_EMBED_API_KEY: ${MINICDC_EMBED_API_KEY:-}
      MINICDC_LLM_MODEL: ${MINICDC_LLM_MODEL:-claude-opus-5-5}
      MINICDC_LLM_API_KEY: ${MINICDC_LLM_API_KEY:-}
      MINICDC_SNAPSHOT_INTERVAL: ${MINICDC_SNAPSHOT_INTERVAL:-5m}
    volumes:
      - bartie_data:/var/lib/bartie
    depends_on:
      source: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  writer:
    profiles: ["live"]
    image: bartie:local
    container_name: bartie-writer
    command: ["writer"]
    environment: *pipeline_env
    volumes:
      - bartie_data:/var/lib/bartie
    depends_on:
      dest: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  vecwriter:
    profiles: ["live"]
    image: bartie:local
    container_name: bartie-vecwriter
    command: ["vecwriter"]
    environment: *pipeline_env
    volumes:
      - bartie_data:/var/lib/bartie
    depends_on:
      dest: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    # on-failure, not unless-stopped: with MINICDC_EMBED_PROVIDER=none it exits
    # 0 on purpose and must stay down.
    restart: on-failure

  api:
    profiles: ["live"]
    image: bartie:local
    container_name: bartie-api
    command: ["api"]
    environment:
      <<: *pipeline_env
      MINICDC_API_ADDR: 0.0.0.0:8080
      MINICDC_API_TOKEN: ${MINICDC_API_TOKEN:-}
      MINICDC_CORS_ORIGINS: ${MINICDC_CORS_ORIGINS:-http://localhost:3000}
      MINICDC_DEMO_RATE_LIMIT: ${MINICDC_DEMO_RATE_LIMIT:-30}
    volumes:
      - bartie_data:/var/lib/bartie
    depends_on:
      source: { condition: service_healthy }
      dest: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Steady, readable writes to the source so the page has something to show.
  # Same image as the databases (it only needs psql). TRAFFIC_INTERVAL=0
  # disables it by exiting immediately.
  traffic:
    profiles: ["live"]
    image: postgres:16
    container_name: bartie-traffic
    entrypoint: ["bash", "-c", "[ \"$$TRAFFIC_INTERVAL\" = 0 ] && exit 0; exec /demo-traffic.sh"]
    environment:
      PGHOST: source
      PGUSER: postgres
      PGPASSWORD: bartie
      PGDATABASE: terra
      TRAFFIC_INTERVAL: ${TRAFFIC_INTERVAL:-2}
    volumes:
      - ../scripts/demo-traffic.sh:/demo-traffic.sh:ro
    depends_on:
      source: { condition: service_healthy }
    restart: on-failure

  caddy:
    profiles: ["live"]
    image: caddy:2-alpine
    container_name: bartie-caddy
    environment:
      # A real domain gets automatic Let's Encrypt TLS. The default is plain
      # HTTP on 8088 for running the live profile on a laptop.
      API_DOMAIN: ${API_DOMAIN:-http://localhost:8088}
    ports:
      - "80:80"
      - "443:443"
      - "8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  source_pgdata:
  dest_pgdata:
  bartie_data:
  caddy_data:
  caddy_config:
